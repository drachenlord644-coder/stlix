<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Color Swapper - Regional & Exclusions</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }
    .controls {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .control-group {
      flex: 1 1 200px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #cccccc;
    }
    input[type="file"], input[type="range"] {
      width: 100%;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #357abd; }
    button.active { background: #2ecc71; }
    button.danger { background: #e74c3c; }
    button.danger:hover { background: #c0392b; }
    
    .canvas-container {
      position: relative;
      border: 2px dashed #444;
      border-radius: 8px;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: none; /* Hidden until upload */
    }
    canvas.mode-draw { cursor: crosshair; }
    canvas.mode-interact { cursor: pointer; }
    .placeholder {
      color: #666;
      position: absolute;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="control-group" style="flex-basis: 100%;">
      <label for="imageUpload">1. Upload Map/Image (PNG/JPG/WEBP):</label>
      <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">
    </div>
    
    <div class="control-group">
      <label>2. Select Tool Mode:</label>
      <div class="button-group">
        <button id="btnDraw" class="active">Draw Regions</button>
        <button id="btnInteract">Hover / Interact</button>
      </div>
    </div>

    <div class="control-group">
      <label>3. Region Management:</label>
      <div class="button-group">
        <button id="btnClear" class="danger">Clear All Regions</button>
      </div>
    </div>

    <div class="control-group" style="flex-basis: 100%;">
      <label for="tolerance">Color Tolerance (Fuzziness): <span id="tolValue">35</span></label>
      <input type="range" id="tolerance" min="0" max="150" value="35">
    </div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <div class="placeholder" id="placeholderText">No image uploaded.</div>
    <canvas id="imageCanvas" class="mode-draw"></canvas>
  </div>

  <script>
    const imageUpload = document.getElementById('imageUpload');
    const toleranceSlider = document.getElementById('tolerance');
    const tolValueDisplay = document.getElementById('tolValue');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const placeholderText = document.getElementById('placeholderText');
    
    const btnDraw = document.getElementById('btnDraw');
    const btnInteract = document.getElementById('btnInteract');
    const btnClear = document.getElementById('btnClear');

    let originalImageData = null;
    let img = new Image();
    
    // Application State
    let mode = 'draw'; 
    let regions = [];
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;
    let activeHoverRegion = null;

    // Define the color swaps
    const colorSwaps = [
      { source: hexToRgb('#fef2d9'), target: hexToRgb('#fcfe6c') },
      { source: hexToRgb('#cfc7b1'), target: hexToRgb('#cfd059') },
      { source: hexToRgb('#b4ac9a'), target: hexToRgb('#bdc052') }
    ];

    // Define protected colors that should NEVER change
    const excludedColors = [
      hexToRgb('#a29992')
    ];

    function hexToRgb(hex) {
      let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    // --- UI Controls ---
    btnDraw.addEventListener('click', () => {
      mode = 'draw';
      btnDraw.classList.add('active');
      btnInteract.classList.remove('active');
      canvas.className = 'mode-draw';
      activeHoverRegion = null;
      redrawBaseAndRegions();
    });

    btnInteract.addEventListener('click', () => {
      mode = 'interact';
      btnInteract.classList.add('active');
      btnDraw.classList.remove('active');
      canvas.className = 'mode-interact';
      redrawBaseAndRegions();
    });

    btnClear.addEventListener('click', () => {
      regions = [];
      activeHoverRegion = null;
      redrawBaseAndRegions();
    });

    toleranceSlider.addEventListener('input', function() {
      tolValueDisplay.textContent = this.value;
      if (mode === 'interact' && activeHoverRegion) {
         applyColorSwap(activeHoverRegion);
      }
    });

    // --- Image Loading ---
    imageUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          
          canvas.style.display = 'block';
          placeholderText.style.display = 'none';
          regions = [];
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    // --- Canvas Mouse Events ---
    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', function(e) {
      if (!originalImageData) return;
      if (mode === 'draw') {
        isDrawing = true;
        const pos = getMousePos(e);
        startX = pos.x;
        startY = pos.y;
      }
    });

    canvas.addEventListener('mousemove', function(e) {
      if (!originalImageData) return;
      const pos = getMousePos(e);

      if (mode === 'draw' && isDrawing) {
        currentX = pos.x;
        currentY = pos.y;
        redrawBaseAndRegions();
        
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        ctx.setLineDash([]);
      } 
      else if (mode === 'interact') {
        let hoveredRegion = regions.find(r => 
          pos.x >= r.x && pos.x <= r.x + r.width &&
          pos.y >= r.y && pos.y <= r.y + r.height
        );

        if (hoveredRegion !== activeHoverRegion) {
          activeHoverRegion = hoveredRegion || null;
          if (activeHoverRegion) {
            applyColorSwap(activeHoverRegion);
          } else {
            redrawBaseAndRegions();
          }
        }
      }
    });

    canvas.addEventListener('mouseup', function(e) {
      if (mode === 'draw' && isDrawing) {
        isDrawing = false;
        const pos = getMousePos(e);
        
        const rx = Math.min(startX, pos.x);
        const ry = Math.min(startY, pos.y);
        const rw = Math.abs(pos.x - startX);
        const rh = Math.abs(pos.y - startY);
        
        if (rw > 5 && rh > 5) {
          regions.push({ x: rx, y: ry, width: rw, height: rh });
        }
        redrawBaseAndRegions();
      }
    });

    canvas.addEventListener('mouseleave', function() {
      if (isDrawing) isDrawing = false;
      if (activeHoverRegion) {
        activeHoverRegion = null;
        redrawBaseAndRegions();
      }
    });

    // --- Core Rendering & Processing Functions ---

    function redrawBaseAndRegions() {
      if (!originalImageData) return;
      ctx.putImageData(originalImageData, 0, 0);
      drawRegionBorders();
    }

    function drawRegionBorders() {
      if (regions.length === 0) return;
      
      ctx.strokeStyle = mode === 'draw' ? 'rgba(46, 204, 113, 0.8)' : 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);

      regions.forEach(r => {
        ctx.strokeRect(r.x, r.y, r.width, r.height);
      });
      ctx.setLineDash([]);
    }

    function applyColorSwap(region) {
      const tolerance = parseInt(toleranceSlider.value);
      const exclusionTolerance = 10; // Tight tolerance to protect the exact hex and slight compression artifacts
      
      const currentData = new ImageData(
        new Uint8ClampedArray(originalImageData.data),
        originalImageData.width,
        originalImageData.height
      );
      const data = currentData.data;
      const width = currentData.width;

      const startY = Math.max(0, Math.floor(region.y));
      const endY = Math.min(originalImageData.height, Math.floor(region.y + region.height));
      const startX = Math.max(0, Math.floor(region.x));
      const endX = Math.min(originalImageData.width, Math.floor(region.x + region.width));

      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          let i = (y * width + x) * 4;
          let r = data[i];
          let g = data[i + 1];
          let b = data[i + 2];

          // 1. Check if the pixel is in our protected exclusion list
          let isProtected = false;
          for (let exc of excludedColors) {
            let excDistance = Math.sqrt(
              Math.pow(r - exc.r, 2) + 
              Math.pow(g - exc.g, 2) + 
              Math.pow(b - exc.b, 2)
            );
            if (excDistance <= exclusionTolerance) {
              isProtected = true;
              break;
            }
          }

          // If protected, skip to the next pixel
          if (isProtected) continue;

          // 2. If not protected, check if it matches a swap target
          for (let swap of colorSwaps) {
            let distance = Math.sqrt(
              Math.pow(r - swap.source.r, 2) + 
              Math.pow(g - swap.source.g, 2) + 
              Math.pow(b - swap.source.b, 2)
            );

            if (distance <= tolerance) {
              data[i]     = swap.target.r;
              data[i + 1] = swap.target.g;
              data[i + 2] = swap.target.b;
              break; 
            }
          }
        }
      }

      ctx.putImageData(currentData, 0, 0);
      drawRegionBorders();
    }
  </script>
</body>
</html>
