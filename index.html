<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stylix - Wiki</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header>
    <h1>stylix</h1>
    <p class="subtitle">Interactive region navigator</p>
  </header>
  <main>
    <section class="interactive-home">
      <div class="navigator">
        <div class="map-frame">
          <button id="arrow-up" class="arrow arrow-big up" aria-label="Go to Brigher Province">
            <img src="interactivemaping/down_arrow_1.png" alt="Up arrow">
          </button>

          <button id="arrow-left" class="arrow arrow-small left" aria-label="Go to Alarrian Wilderness">
            <img src="interactivemaping/right_arrow_1.png" alt="Left arrow">
          </button>

          <div class="region-display">
            <img id="region-image" src="interactivemaping/alarrRegion.png" alt="Alarr Region">
            <p id="region-name" class="region-label">Alarr Region</p>
            <div class="home-map-links" id="home-map-links"></div>
          </div>

          <button id="arrow-right" class="arrow arrow-small right" aria-label="Go to Alarr Coast">
            <img src="interactivemaping/right_arrow_1.png" alt="Right arrow">
          </button>

          <button id="arrow-down" class="arrow arrow-big down hidden" aria-label="Go back to Alarr Region">
            <img src="interactivemaping/down_arrow_1.png" alt="Down arrow">
          </button>
        </div>
      </div>
  </main>
  <footer>
    <small>stylix — map navigator</small>
  </footer>

  <script>
    const regions = {
      alarrRegion: {
        name: 'Alarr Region',
        src: 'interactivemaping/alarrRegion.png',
        alt: 'Alarr Region',
        arrows: { left: 'alarrianWilderness', right: 'alarrCoast', up: 'brigherProvince' }
      },
      alarrCoast: {
        name: 'Alarr Coast',
        src: 'interactivemaping/AlarrCoast.png',
        alt: 'Alarr Coast',
        arrows: { left: 'alarrRegion' }
      },
      alarrianWilderness: {
        name: 'Alarrian Wilderness',
        src: 'interactivemaping/AlrrianWilderness.png',
        alt: 'Alarrian Wilderness',
        arrows: { right: 'alarrRegion' }
      },
      brigherProvince: {
        name: 'Brigher Province',
        src: 'interactivemaping/BriarProvince.png',
        alt: 'Brigher Province',
        arrows: { down: 'alarrRegion' }
      }
    };

    const state = { current: 'alarrRegion' };
    const regionImage = document.getElementById('region-image');
    const regionName = document.getElementById('region-name');
    const homeMapLinks = document.getElementById('home-map-links');
    const arrowUp = document.getElementById('arrow-up');
    const arrowDown = document.getElementById('arrow-down');
    const arrowLeft = document.getElementById('arrow-left');
    const arrowRight = document.getElementById('arrow-right');

    const regionButtons = {
      alarrRegion: [
        { label: 'Skyline Hill', href: 'docs/alarr-region/skyline-hill-1.html' },
        { label: 'Briar Heights', href: 'docs/alarr-region/briar-heights-6.html' },
        { label: 'Mount Solkara', href: 'docs/alarr-region/mount-solkara-4.html' },
        { label: 'Stoneveil Peak', href: 'docs/alarr-region/stoneveil-peak-1.html' },
        { label: 'Flatrock Crest', href: 'docs/alarr-region/flatrock-crest-1.html' },
        { label: 'Training Grounds', href: 'docs/alarr-region/training-grounds-1.html' },
        { label: 'Willow Back Rise', href: 'docs/alarr-region/willow-back-rise-1.html' },
        { label: 'Branchline Stockyard', href: 'docs/alarr-region/branchline-stockyard-1.html' },
        { label: 'Pebbletop', href: 'docs/alarr-region/pebbletop-1.html' },
        { label: 'Climbers Ascention', href: 'docs/alarr-region/climbers-ascention-2.html' },
        { label: 'Ruined Skyscraper', href: 'docs/alarr-region/ruined-skyscraper-5.html' },
        { label: 'Carl\'s Supply Shack', href: 'docs/alarr-region/carls-supply-shack.html' },
        { label: 'Cliffside Lunar', href: 'docs/alarr-region/cliffside-lunar-3.html' }
      ],
      alarrCoast: [],
      alarrianWilderness: [],
      brigherProvince: []
    };

    function renderLinks(buttons) {
      homeMapLinks.innerHTML = '';
      if (!buttons?.length) return;
      buttons.forEach(({ label, href }, index) => {
        const link = document.createElement('a');
        link.className = `home-map-link home-link-${index + 1}`;
        link.href = href;
        link.textContent = label;
        homeMapLinks.appendChild(link);
      });
    }

    function updateArrow(button, direction, target) {
      if (!target) {
        button.classList.add('hidden');
        button.removeAttribute('aria-label');
        button.onclick = null;
        return;
      }

      const labelMap = {
        up: 'Go to Brigher Province',
        down: 'Go back to Alarr Region',
        left: 'Go to Alarrian Wilderness',
        right: 'Go to Alarr Coast'
      };

      button.classList.remove('hidden');
      button.setAttribute('aria-label', labelMap[direction] || 'Navigate');
      button.onclick = () => {
        state.current = target;
        render();
      };
    }

    function render() {
      const region = regions[state.current];
      regionImage.src = region.src;
      regionImage.alt = region.alt;
      regionName.textContent = region.name;

      renderLinks(regionButtons[state.current]);
      updateArrow(arrowUp, 'up', region.arrows?.up);
      updateArrow(arrowDown, 'down', region.arrows?.down);
      updateArrow(arrowLeft, 'left', region.arrows?.left);
      updateArrow(arrowRight, 'right', region.arrows?.right);
    }

    render();
  </script>
</body>
</html>
