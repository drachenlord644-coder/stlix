<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stylix - Wiki</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header>
    <h1>stylix</h1>
    <p class="subtitle">Interactive region navigator</p>
  </header>
  <main>
    <section class="interactive-home">
      <div class="navigator">
        <div class="map-frame">
          <button id="arrow-up" class="arrow arrow-big up" aria-label="Go to Brigher Province">
            <img src="interactivemaping/down_arrow_1.png" alt="Up arrow">
          </button>

          <button id="arrow-left" class="arrow arrow-small left" aria-label="Go to Alarrian Wilderness">
            <img src="interactivemaping/right_arrow_1.png" alt="Left arrow">
          </button>

          <div class="region-display">
            <img id="region-image" src="interactivemaping/alarrRegion.png" alt="Alarr Region">
            <canvas id="region-canvas" aria-hidden="true"></canvas>
            <div class="home-map-links" id="home-map-links"></div>
          </div>

          <button id="arrow-right" class="arrow arrow-small right" aria-label="Go to Alarr Coast">
            <img src="interactivemaping/right_arrow_1.png" alt="Right arrow">
          </button>

          <button id="arrow-down" class="arrow arrow-big down hidden" aria-label="Go back to Alarr Region">
            <img src="interactivemaping/down_arrow_1.png" alt="Down arrow">
          </button>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <small>stylix — map navigator</small>
  </footer>

  <script>
    const regions = {
      alarrRegion: {
        name: 'Alarr Region',
        src: 'interactivemaping/alarrRegion.png',
        alt: 'Alarr Region',
        arrows: { left: 'alarrianWilderness', right: 'alarrCoast', up: 'brigherProvince' }
      },
      alarrCoast: {
        name: 'Alarr Coast',
        src: 'interactivemaping/AlarrCoast.png',
        alt: 'Alarr Coast',
        arrows: { left: 'alarrRegion' }
      },
      alarrianWilderness: {
        name: 'Alarrian Wilderness',
        src: 'interactivemaping/AlrrianWilderness.png',
        alt: 'Alarrian Wilderness',
        arrows: { right: 'alarrRegion' }
      },
      brigherProvince: {
        name: 'Brigher Province',
        src: 'interactivemaping/BriarProvince.png',
        alt: 'Brigher Province',
        arrows: { down: 'alarrRegion' }
      }
    };

    const state = { current: 'alarrRegion' };
    const regionImage = document.getElementById('region-image');
    const regionCanvas = document.getElementById('region-canvas');
    const homeMapLinks = document.getElementById('home-map-links');
    const regionDisplay = document.querySelector('.region-display');
    const arrowUp = document.getElementById('arrow-up');
    const arrowDown = document.getElementById('arrow-down');
    const arrowLeft = document.getElementById('arrow-left');
    const arrowRight = document.getElementById('arrow-right');

    // Color swaps: { target, replacement, tolerance }
    const colorSwaps = [
      { target: { r: 254, g: 249, b: 222 }, replacement: { r: 238, g: 240, b: 99 }, tolerance: 40 },  // #fef9de -> #eef063
      { target: { r: 210, g: 201, b: 179 }, replacement: { r: 208, g: 210, b: 86 }, tolerance: 40 }  // #d2c9b3 -> #d0d256
    ];
    const sourceCanvas = document.createElement('canvas');
    const sourceCtx = sourceCanvas.getContext('2d');
    const overlayCtx = regionCanvas.getContext('2d');
    let imageReady = false;
    let yellowReady = false;

    function colorDistance(r1, g1, b1, r2, g2, b2) {
      return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
    }

    // Returns the replacement color for a pixel, or null if it should stay.
    function getReplacementColor(r, g, b, a) {
      if (a < 220) return null;
      for (const swap of colorSwaps) {
        if (colorDistance(r, g, b, swap.target.r, swap.target.g, swap.target.b) < swap.tolerance) {
          return swap.replacement;
        }
      }
      return null;
    }

    function resizeCanvases() {
      const width = regionImage.naturalWidth || regionImage.width;
      const height = regionImage.naturalHeight || regionImage.height;
      if (!width || !height) return;
      sourceCanvas.width = regionCanvas.width = width;
      sourceCanvas.height = regionCanvas.height = height;
      regionCanvas.style.width = '100%';
      regionCanvas.style.height = '100%';
    }

    function updateSourceCanvas() {
      resizeCanvases();
      sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      sourceCtx.drawImage(regionImage, 0, 0, sourceCanvas.width, sourceCanvas.height);
      imageReady = true;
      prerenderYellow();
    }

    // Pre-render the full map with its light/white pixels replaced by yellow.
    // This is done ONCE per image; hovering then just reveals the relevant
    // slice of this overlay (see showHighlight), which avoids any per-hover
    // canvas work and any layout shift.
    function prerenderYellow() {
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      if (!width || !height || !imageReady) return;
      try {
        const imageData = sourceCtx.getImageData(0, 0, width, height);
        overlayCtx.clearRect(0, 0, regionCanvas.width, regionCanvas.height);
        overlayCtx.putImageData(replaceTargetPixels(imageData), 0, 0);
        yellowReady = true;
      } catch (e) {
        yellowReady = false;
        console.warn('Yellow map highlight unavailable:', e);
      }
    }

    function replaceTargetPixels(imageData) {
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const replacement = getReplacementColor(data[i], data[i + 1], data[i + 2], data[i + 3]);
        if (replacement) {
          data[i] = replacement.r;
          data[i + 1] = replacement.g;
          data[i + 2] = replacement.b;
          data[i + 3] = 255;
        }
      }
      return imageData;
    }

    // The map image is shown with object-fit:contain, so it may be letterboxed
    // inside its element box. Return the actual displayed content box.
    function getImageContentBox() {
      const rect = regionImage.getBoundingClientRect();
      const natW = regionImage.naturalWidth;
      const natH = regionImage.naturalHeight;
      if (!natW || !natH) return null;
      const natAspect = natW / natH;
      const curAspect = rect.width / rect.height;
      let x = rect.left, y = rect.top, w = rect.width, h = rect.height;
      if (natAspect > curAspect) {
        h = rect.width / natAspect;
        y = rect.top + (rect.height - h) / 2;
      } else {
        w = rect.height * natAspect;
        x = rect.left + (rect.width - w) / 2;
      }
      return { left: x, top: y, width: w, height: h };
    }

    // Reposition the overlay canvas so it exactly covers the displayed map
    // content, then clip it to the hovered button's area.
    function showHighlight(link) {
      if (!yellowReady || !imageReady) return;
      const content = getImageContentBox();
      if (!content) return;
      const frameRect = regionDisplay.getBoundingClientRect();
      regionCanvas.style.position = 'absolute';
      regionCanvas.style.left = `${content.left - frameRect.left}px`;
      regionCanvas.style.top = `${content.top - frameRect.top}px`;
      regionCanvas.style.width = `${content.width}px`;
      regionCanvas.style.height = `${content.height}px`;

      const r = link.getBoundingClientRect();
      const left = Math.max(r.left, content.left);
      const top = Math.max(r.top, content.top);
      const right = Math.min(r.right, content.left + content.width);
      const bottom = Math.min(r.bottom, content.top + content.height);
      if (right <= left || bottom <= top) {
        regionCanvas.style.visibility = 'hidden';
        return;
      }
      const clipTop = top - content.top;
      const clipRight = content.left + content.width - right;
      const clipBottom = content.top + content.height - bottom;
      const clipLeft = left - content.left;
      regionCanvas.style.clipPath = `inset(${clipTop}px ${clipRight}px ${clipBottom}px ${clipLeft}px)`;
      regionCanvas.style.visibility = 'visible';
    }

    function hideHighlight() {
      regionCanvas.style.visibility = 'hidden';
    }

    function wireLinkHover() {
      homeMapLinks.querySelectorAll('.home-map-link').forEach((link) => {
        link.addEventListener('mouseenter', () => showHighlight(link));
        link.addEventListener('mouseleave', hideHighlight);
        link.addEventListener('focus', () => showHighlight(link));
        link.addEventListener('blur', hideHighlight);
      });
    }

    const regionButtons = {
      alarrRegion: [
        { label: 'Skyline Hill', href: 'docs/alarr-region/skyline-hill-1.html' },
        { label: 'Briar Heights', href: 'docs/alarr-region/briar-heights-6.html' },
        { label: 'Mount Solkara', href: 'docs/alarr-region/mount-solkara-4.html' },
        { label: 'Stoneveil Peak', href: 'docs/alarr-region/stoneveil-peak-1.html' },
        { label: 'Flatrock Crest', href: 'docs/alarr-region/flatrock-crest-1.html' },
        { label: 'Training Grounds', href: 'docs/alarr-region/training-grounds-1.html' },
        { label: 'Willow Back Rise', href: 'docs/alarr-region/willow-back-rise-1.html' },
        { label: 'Branchline Stockyard', href: 'docs/alarr-region/branchline-stockyard-1.html' },
        { label: 'Pebbletop', href: 'docs/alarr-region/pebbletop-1.html' },
        { label: 'Climbers Ascention', href: 'docs/alarr-region/climbers-ascention-2.html' },
        { label: 'Ruined Skyscraper', href: 'docs/alarr-region/ruined-skyscraper-5.html' },
        { label: 'Carl\'s Supply Shack', href: 'docs/alarr-region/carls-supply-shack.html' },
        { label: 'Cliffside Lunar', href: 'docs/alarr-region/cliffside-lunar-3.html' }
      ],
      alarrCoast: [],
      alarrianWilderness: [],
      brigherProvince: []
    };

    function renderLinks(buttons) {
      homeMapLinks.innerHTML = '';
      if (!buttons?.length) return;
      buttons.forEach(({ label, href }, index) => {
        const link = document.createElement('a');
        link.className = `home-map-link home-link-${index + 1}`;
        link.href = href;
        link.textContent = label;
        homeMapLinks.appendChild(link);
      });
    }

    function updateArrow(button, direction, target) {
      if (!target) {
        button.classList.add('hidden');
        button.removeAttribute('aria-label');
        button.onclick = null;
        return;
      }

      const labelMap = {
        up: 'Go to Brigher Province',
        down: 'Go back to Alarr Region',
        left: 'Go to Alarrian Wilderness',
        right: 'Go to Alarr Coast'
      };

      button.classList.remove('hidden');
      button.setAttribute('aria-label', labelMap[direction] || 'Navigate');
      button.onclick = () => {
        state.current = target;
        render();
      };
    }

    function render() {
      hideHighlight();
      const region = regions[state.current];
      regionImage.src = region.src;
      regionImage.alt = region.alt;

      renderLinks(regionButtons[state.current]);
      wireLinkHover();
      updateArrow(arrowUp, 'up', region.arrows?.up);
      updateArrow(arrowDown, 'down', region.arrows?.down);
      updateArrow(arrowLeft, 'left', region.arrows?.left);
      updateArrow(arrowRight, 'right', region.arrows?.right);
    }

    regionImage.addEventListener('load', updateSourceCanvas);
    render();
    hideHighlight();
    window.addEventListener('resize', hideHighlight);
    if (regionImage.complete && regionImage.naturalWidth) {
      updateSourceCanvas();
    }
  </script>
</body>
</html>
